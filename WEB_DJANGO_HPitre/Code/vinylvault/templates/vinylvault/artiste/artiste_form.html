{% extends 'base.html' %}
{% load i18n %}
{% block title %}{{ titre }}{% endblock %}
{% block content %}
    <h1>{{ titre }}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">{% translate "Enregistrer" %}</button>
        <a href="{% url 'vinylvault:liste_artistes' %}" class="btn btn-secondary">{% translate "Annuler" %}</a>
    </form>
{% endblock %}
