{% extends 'base.html' %}
{% load i18n %}
{% block title %}{{ titre }}{% endblock %}
{% block content %}
    <h1>{{ titre }}</h1>
    <!--enctype form data pour faire fonctionner img upload-->
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-secondary">{% translate "Enregistrer" %}</button>
        <a href="{% url 'vinylvault:liste_albums' %}" class="btn btn-danger">{% translate "Annuler" %}</a>
    </form>
{% endblock %}
